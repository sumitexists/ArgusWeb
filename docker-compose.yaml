services:
  ollama_server:
    image: ollama/ollama:latest
    container_name: ollama_server
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=-1 
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama_data:
