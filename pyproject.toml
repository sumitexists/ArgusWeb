[project]
name = "argusweb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <=3.13"
dependencies = [
    "bm25s>=0.3.16",
    "dotenv-python>=0.0.1",
    "ipython>=9.18.1",
    "langchain>=1.4.8",
    "langchain-core>=1.7.6",
    "langchain-google-genai>=4.5.0",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.19",
    "notebook>=7.6.4",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "pystemmer>=3.1.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
argusweb = "argusweb:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
